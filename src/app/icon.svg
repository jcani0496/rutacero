<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RutaCero">
  <!--
    RutaCero brand mark - monogram (teal refinement, 2026-07).

    Dark slate rounded square + teal "0" drawn as an OPEN ring: the stroke
    breaks at the upper right and the enlarged sky dot sits in the gap, so
    the mark reads as a route arriving at zero (waypoint -> destination)
    instead of a closed letter "O" / generic spinner. Dot enlarged from
    r=3.5 to r=5 so it survives 16x16 favicon rendering (~2.5px).

    Palette:
      - slate-900 (#0F172A): background container
      - teal-500 (#14B8A6): the zero (brand primary family, replaces
        emerald - the old green collided with delivery/quick-loan apps
        in the Guatemalan market)
      - sky-500 (#0EA5E9): route waypoint / destination dot
  -->
  <rect width="64" height="64" rx="12" ry="12" fill="#0F172A"/>
  <path
    d="M 35.49 15.61 A 13.5 18 0 1 0 43.69 24"
    fill="none"
    stroke="#14B8A6"
    stroke-width="7"
    stroke-linecap="round"
  />
  <circle cx="45.5" cy="14.5" r="5" fill="#0EA5E9"/>
</svg>
