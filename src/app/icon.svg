<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RutaCero">
  <!--
    RutaCero brand mark — monogram.
    Dark slate rounded square + emerald "0" (oval ring) + sky-blue accent dot
    at upper-right. Stroke is bold enough to remain readable at 16x16 favicon.

    Palette:
      - slate-900 (#0F172A): background container
      - emerald-500 (#10B981): the zero (brand primary)
      - sky-500 (#0EA5E9): progress / "destination" accent dot
  -->
  <rect width="64" height="64" rx="12" ry="12" fill="#0F172A"/>
  <ellipse
    cx="32" cy="33"
    rx="13.5" ry="18"
    fill="none"
    stroke="#10B981"
    stroke-width="7"
    stroke-linecap="round"
  />
  <circle cx="47.5" cy="15" r="3.5" fill="#0EA5E9"/>
</svg>
