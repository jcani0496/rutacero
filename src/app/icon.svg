<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RutaCero">
  <!--
    RutaCero brand mark (interim).
    Solid emerald rounded square with a white "R" centered. Replace this file
    with a designed brand mark when one is available — Next 16 picks up any
    src/app/icon.{svg,png,ico} automatically as the site favicon.
  -->
  <rect width="64" height="64" rx="14" ry="14" fill="#10B981"/>
  <text
    x="32"
    y="32"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#FFFFFF"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="-2"
  >R</text>
</svg>
