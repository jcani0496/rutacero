# F6: Supabase production migrations are retired.
# Schema changes now go through Drizzle (`drizzle-kit push` / Railway Postgres).
# The historical SQL corpus lives under archive/supabase/.
#
# This workflow is intentionally a no-op so old path filters cannot re-apply
# Supabase migrations to a project we no longer use as source of truth.
name: Apply Supabase migrations to production (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired — use Drizzle / Railway
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "F6 cutover: Supabase db push is retired."
          echo "Apply schema via Drizzle against Railway Postgres instead."
          exit 0
