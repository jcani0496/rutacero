name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint Typecheck Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        # Build-only dummy envs: pages prerender Supabase client at module load,
        # which throws without these. Real values come from Vercel at deploy time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-dummy-service-role-key
          ADMIN_JWT_SECRET: ci-build-dummy-admin-jwt-secret-must-be-at-least-sixty-four-chars-long-padding
          CRON_SECRET: ci-build-dummy-cron-secret
        run: npm run build

  e2e:
    name: E2E Login (Supabase Local)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version verified locally. "latest" drifted (July
          # 2026) and the newer local stack denies service-role inserts into
          # tenants during the RLS integration tests. Bump deliberately.
          version: 2.101.0

      - name: Start Supabase Local
        run: supabase start

      - name: Apply local migrations
        run: supabase db reset --local --yes

      - name: Export Supabase env for app
        shell: bash
        run: |
          supabase status -o env | awk -F= '/^[A-Z_]+=\"?.*\"?$/{print}' > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "ADMIN_JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Security Integration Tests
        run: npm run test:security

      - name: E2E Login
        run: npm run test:e2e:login

      - name: E2E Accessibility (axe-core)
        run: npx playwright test e2e/a11y.spec.ts --reporter=list

  # Deploys are handled by Railway's GitHub integration:
  #  - push to main        → production deploy
  #  - pull request        → ephemeral PR environment (preview URL on the PR)
  # The old Vercel deploy jobs were removed in the Railway migration.
  # Cron scheduling moved to .github/workflows/crons.yml.
