name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint Typecheck Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          DATABASE_URL: postgresql://rutacero:rutacero@localhost:54329/rutacero
          BETTER_AUTH_SECRET: ci-build-dummy-better-auth-secret-must-be-at-least-thirty-two-chars
          AUTH_PROVIDER: better-auth
          NEXT_PUBLIC_AUTH_PROVIDER: better-auth
          DATA_PROVIDER: drizzle
          STORAGE_PROVIDER: railway
          NEXT_PUBLIC_STORAGE_PROVIDER: railway
          ADMIN_JWT_SECRET: ci-build-dummy-admin-jwt-secret-must-be-at-least-sixty-four-chars-long-padding
          CRON_SECRET: ci-build-dummy-cron-secret
        run: npm run build

  e2e:
    name: E2E Login (Postgres + better-auth)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Postgres
        run: docker compose -f docker-compose.db.yml up -d --wait

      - name: Push schema + seed
        env:
          DATABASE_URL: postgresql://rutacero:rutacero@localhost:54329/rutacero
        run: |
          npm run db:push:local
          npm run db:seed:local

      - name: Export app env
        shell: bash
        run: |
          {
            echo "DATABASE_URL=postgresql://rutacero:rutacero@localhost:54329/rutacero"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://127.0.0.1:3200"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3200"
            echo "AUTH_PROVIDER=better-auth"
            echo "NEXT_PUBLIC_AUTH_PROVIDER=better-auth"
            echo "DATA_PROVIDER=drizzle"
            echo "STORAGE_PROVIDER=railway"
            echo "NEXT_PUBLIC_STORAGE_PROVIDER=railway"
            echo "ADMIN_JWT_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            echo "SEED_ADMIN_EMAIL=admin@rutacero.gt"
            echo "SEED_ADMIN_PASSWORD=Admin123!"
          } >> "$GITHUB_ENV"

      - name: Seed admin user
        run: npm run seed:admin

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E Login
        run: npm run test:e2e:login

      - name: E2E Accessibility (axe-core)
        run: npx playwright test e2e/a11y.spec.ts --reporter=list

  # Deploys are handled by Railway's GitHub integration:
  #  - push to main        → production deploy
  #  - pull request        → ephemeral PR environment (preview URL on the PR)
  # Cron scheduling lives in .github/workflows/crons.yml.
