<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="RutaCero">
  <!--
    RutaCero wordmark (monogram + lettering).

    Layout:
      - Icon block on the left (80x80): same construction as src/app/icon.svg
        but scaled to 80px so it visually balances the wordmark height.
      - "RutaCero" wordmark to the right in dark slate, weight 700.

    Palette (matches src/app/icon.svg):
      - slate-900 (#0F172A): icon container background + wordmark text color
      - emerald-500 (#10B981): the zero (brand primary)
      - sky-500 (#0EA5E9): progress / "destination" accent dot

    Usage: light backgrounds (emails, light pages, marketing). For dark
    backgrounds, a sibling `logo-dark.svg` with white wordmark text would
    be the cleanest approach — out of scope for this PR.
  -->

  <rect x="0" y="0" width="80" height="80" rx="15" ry="15" fill="#0F172A"/>
  <ellipse
    cx="40" cy="41"
    rx="17" ry="22.5"
    fill="none"
    stroke="#10B981"
    stroke-width="8.75"
    stroke-linecap="round"
  />
  <circle cx="59" cy="19" r="4.5" fill="#0EA5E9"/>

  <text
    x="96" y="51"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="44"
    font-weight="700"
    fill="#0F172A"
    letter-spacing="-1.5"
  >RutaCero</text>
</svg>
